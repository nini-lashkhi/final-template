<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lumi Beauty | Contact</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <nav class="nav">
      <a class="nav__logo" href="index.html">Lumi</a>
      <ul class="nav__list">
        <li><a class="nav__link" href="index.html">Home</a></li>
        <li><a class="nav__link" href="products.html">Products</a></li>
        <li><a class="nav__link" href="favorites.html">Favorites</a></li>
        <li><a class="nav__link nav__link--active" href="contact.html">Contact</a></li>
        <li><a class="nav__link" href="signin.html">Sign In</a></li>
        <li><a class="nav__link nav__link--button" href="signup.html">Sign Up</a></li>
 
      </ul>
    </nav>
  </header>

  <main class="auth">
    <section class="auth__section">
      <form class="auth-card" action="#" method="post">
        <h1 class="auth-card__title">Contact Us</h1>

        <div class="form-field">
          <label class="form-field__label" for="name">Full Name</label>
          <input class="form-field__input" type="text" id="name" name="name" required>
        </div>

        <div class="form-field">
          <label class="form-field__label" for="email">Email</label>
          <input class="form-field__input" type="email" id="email" name="email" required>
        </div>

        <div class="form-field">
          <label class="form-field__label" for="subject">Subject</label>
          <input class="form-field__input" type="text" id="subject" name="subject" required>
        </div>

        <div class="form-field">
          <label class="form-field__label" for="message">Message</label>
          <textarea class="form-field__input form-field__textarea" id="message" name="message" rows="5" required></textarea>
        </div>

        <button class="button button--primary auth-card__button" type="submit">Send Message</button>
      </form>
    </section>
  </main>

  <footer class="footer">
    <div class="footer__inner">
      <h2 class="footer__logo">Lumi</h2>
     
      <div class="footer__social">
        <a href="https://instagram.com" target="_blank">Instagram</a>
        <a href="https://pinterest.com" target="_blank">Pinterest</a>
        <a href="https://tiktok.com" target="_blank">TikTok</a>
      </div>
    </div>
    <p class="footer__copy">Copyright 2026 Lumi Beauty. All rights reserved.</p>
  </footer>
</body>
</html>
